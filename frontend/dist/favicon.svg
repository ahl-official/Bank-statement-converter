<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#151d2f" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="10" />

  <!-- Outer Tech Circuit Ring -->
  <circle cx="256" cy="256" r="190" stroke="#1e293b" stroke-width="3" fill="none" opacity="0.6" />
  <circle cx="256" cy="256" r="145" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="8 8" fill="none" opacity="0.4" />

  <!-- Bank Pediment / Roof -->
  <polygon points="136,180 256,96 376,180" fill="url(#tealGrad)" />
  <rect x="126" y="186" width="260" height="14" rx="4" fill="url(#tealGrad)" />

  <!-- Bank Pillars -->
  <rect x="152" y="214" width="26" height="114" rx="6" fill="url(#tealGrad)" opacity="0.9" />
  <rect x="214" y="214" width="26" height="114" rx="6" fill="url(#tealGrad)" opacity="0.9" />
  <rect x="272" y="214" width="26" height="114" rx="6" fill="url(#tealGrad)" opacity="0.9" />
  <rect x="334" y="214" width="26" height="114" rx="6" fill="url(#tealGrad)" opacity="0.9" />

  <!-- Base Steps -->
  <rect x="120" y="340" width="272" height="16" rx="4" fill="url(#tealGrad)" />
  <rect x="104" y="364" width="304" height="18" rx="5" fill="url(#tealGrad)" />

  <!-- Central Tally Bridge Emblem -->
  <g transform="translate(256, 270)">
    <!-- Shield Circle -->
    <circle cx="0" cy="0" r="58" fill="#090d16" stroke="#2dd4bf" stroke-width="5" />
    
    <!-- Bold Tally "T" -->
    <path d="M-26 -22 L26 -22 L26 -9 L8 -9 L8 24 L-8 24 L-8 -9 L-26 -9 Z" fill="url(#tealGrad)" />
    
    <!-- Conversion Loop Sync Arrows -->
    <path d="M-26 36 L-14 44 L-26 52" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-14 44 L16 44" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M26 -36 L14 -44 L26 -52" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M14 -44 L-16 -44" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- XML Voucher Badge -->
  <rect x="334" y="396" width="94" height="32" rx="7" fill="#0f172a" stroke="#2dd4bf" stroke-width="2" />
  <text x="381" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#5eead4" text-anchor="middle">&lt;XML&gt;</text>
</svg>
